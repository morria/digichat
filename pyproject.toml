[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digichat"
version = "0.1.0"
description = "A curses-based chat interface for amateur radio digital modes (CW, PSK31, RTTY)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["ham radio", "amateur radio", "digital modes", "CW", "PSK31", "RTTY", "curses"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyaudio>=0.2.13",
    "windows-curses>=2.3.0; platform_system=='Windows'",
    # Audio processing
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    # DSP and signal processing
    "numba>=0.57.0",  # JIT compilation for performance
    # Optional hamlib support (will be via ctypes/subprocess)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.287",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]
decoders = [
    "morse-audio-decoder>=0.1.0",  # CW decoder
    "python-baudot>=1.0.0",  # RTTY Baudot encoding/decoding
]

[project.scripts]
digichat = "digichat.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/digichat"
Repository = "https://github.com/yourusername/digichat"
Documentation = "https://github.com/yourusername/digichat/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=digichat --cov-report=term-missing"

[tool.isort]
profile = "black"
line_length = 100
